# Continuous integration: every push and pull request runs all three test suites and builds every
# Docker image. Jobs run in parallel; any failure fails the workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rate-limiter:
    name: Rate limiter (Java 21 · JUnit · Mockito · Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rate-limiter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (integration tests run against real Redis via Testcontainers)
        run: mvn -B -ntp clean verify
      - name: Fail if any test was skipped
        # Testcontainers skips tests silently when Docker is unreachable; a green build must mean
        # every test actually ran.
        run: |
          if grep -hE "Skipped: [1-9]" target/surefire-reports/*.txt; then
            echo "::error::Some tests were skipped"; exit 1
          fi
          grep -h "Tests run" target/surefire-reports/*.txt \
            | awk -F'[:,]' '{t+=$2} END {print "Java tests run: " t}'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rate-limiter-surefire-reports
          path: rate-limiter/target/surefire-reports

  ai-agent:
    name: AI agent (Python · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-agent/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (LLM calls are mocked; no API key needed)
        run: python -m pytest -q

  dashboard-bff:
    name: Dashboard backend (Python · import check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard-bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard-bff/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and import the app
        run: |
          python -m compileall -q app
          python -c "import app.main; print('dashboard-bff imports OK')"

  frontend:
    name: Frontend (TypeScript · ESLint · Vitest · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Type-check and production build
        run: npm run build

  docker-images:
    name: Docker images (compose build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build every service image
        run: docker compose build
