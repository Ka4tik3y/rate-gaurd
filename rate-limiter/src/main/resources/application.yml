spring:
  application.name: rate-limiter
  data.redis:
    host: ${SPRING_DATA_REDIS_HOST:localhost}
    port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud.gateway.routes:
    - id: downstream
      uri: ${DOWNSTREAM_URL:http://httpbin.org}
      predicates:
        - Path=/api/**
      filters:
        - StripPrefix=1
management.endpoints.web.exposure.include: health,prometheus
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  default.capacity: ${RATE_LIMIT_DEFAULT_CAPACITY:100}
  default.refill-rate: ${RATE_LIMIT_DEFAULT_REFILL_RATE:10}
  identifier.type: ${RATE_LIMIT_IDENTIFIER_TYPE:IP}
  redis.failure-mode: ${RATE_LIMIT_REDIS_FAILURE_MODE:FAIL_OPEN}
traffic-metrics:
  enabled: ${TRAFFIC_METRICS_ENABLED:true}
  retention-minutes: ${TRAFFIC_METRICS_RETENTION_MINUTES:15}
  windows: ${TRAFFIC_METRICS_WINDOWS:1,5,10}
anomaly:
  enabled: ${ANOMALY_ENABLED:true}
  interval-seconds: ${ANOMALY_INTERVAL_SECONDS:60}
  active-window-minutes: ${ANOMALY_ACTIVE_WINDOW_MINUTES:10}
  evaluation-window-minutes: ${ANOMALY_EVALUATION_WINDOW_MINUTES:5}
  ewma-alpha: ${ANOMALY_EWMA_ALPHA:0.2}
  z-threshold: ${ANOMALY_Z_THRESHOLD:3.0}
  high-z-threshold: ${ANOMALY_HIGH_Z_THRESHOLD:5.0}
  warmup-samples: ${ANOMALY_WARMUP_SAMPLES:5}
  reject-ratio-threshold: ${ANOMALY_REJECT_RATIO_THRESHOLD:0.5}
  error-ratio-threshold: ${ANOMALY_ERROR_RATIO_THRESHOLD:0.2}
  burstiness-threshold: ${ANOMALY_BURSTINESS_THRESHOLD:3.0}
agent:
  # Global kill switch default; the live value is held in Redis and toggled via the admin API.
  enabled: ${AGENT_ENABLED:true}
policy-gate:
  max-change-ratio: ${POLICY_GATE_MAX_CHANGE_RATIO:0.5}
  min-capacity: ${POLICY_GATE_MIN_CAPACITY:1}
  max-capacity: ${POLICY_GATE_MAX_CAPACITY:100000}
  max-block-seconds: ${POLICY_GATE_MAX_BLOCK_SECONDS:3600}
  cooldown-seconds: ${POLICY_GATE_COOLDOWN_SECONDS:60}
  max-actions-per-window: ${POLICY_GATE_MAX_ACTIONS_PER_WINDOW:10}
  action-window-seconds: ${POLICY_GATE_ACTION_WINDOW_SECONDS:3600}
  min-evidence-deviation: ${POLICY_GATE_MIN_EVIDENCE_DEVIATION:2.0}
  agent-max-capacity: ${POLICY_GATE_AGENT_MAX_CAPACITY:500}
  agent-override-ttl-seconds: ${POLICY_GATE_AGENT_OVERRIDE_TTL_SECONDS:1800}
  block-memory-seconds: ${POLICY_GATE_BLOCK_MEMORY_SECONDS:1800}
admin:
  security:
    # Dev-only placeholders. Override via env in any real deployment.
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin}
    agent-username: ${AGENT_USERNAME:agent}
    agent-password: ${AGENT_PASSWORD:agent}
