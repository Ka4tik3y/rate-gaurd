services:
  # A local echo service that /api/** forwards to, so the demo never sends traffic to the public
  # internet. Not published — only reachable inside the compose network.
  httpbin:
    image: mccutchen/go-httpbin:latest
    expose:
      - "8080"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  rate-limiter:
    build: ./rate-limiter
    environment:
      SPRING_DATA_REDIS_HOST: redis
      DOWNSTREAM_URL: ${DOWNSTREAM_URL:-http://httpbin:8080}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT_CAPACITY: ${RATE_LIMIT_DEFAULT_CAPACITY:-100}
      RATE_LIMIT_DEFAULT_REFILL_RATE: ${RATE_LIMIT_DEFAULT_REFILL_RATE:-10}
      RATE_LIMIT_IDENTIFIER_TYPE: ${RATE_LIMIT_IDENTIFIER_TYPE:-IP}
      RATE_LIMIT_REDIS_FAILURE_MODE: ${RATE_LIMIT_REDIS_FAILURE_MODE:-FAIL_OPEN}
      TRAFFIC_METRICS_ENABLED: ${TRAFFIC_METRICS_ENABLED:-true}
      ANOMALY_ENABLED: ${ANOMALY_ENABLED:-true}
      ANOMALY_INTERVAL_SECONDS: ${ANOMALY_INTERVAL_SECONDS:-20}
      ANOMALY_EVALUATION_WINDOW_MINUTES: ${ANOMALY_EVALUATION_WINDOW_MINUTES:-5}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      POLICY_GATE_MAX_CHANGE_RATIO: ${POLICY_GATE_MAX_CHANGE_RATIO:-0.5}
      POLICY_GATE_MAX_BLOCK_SECONDS: ${POLICY_GATE_MAX_BLOCK_SECONDS:-3600}
      POLICY_GATE_COOLDOWN_SECONDS: ${POLICY_GATE_COOLDOWN_SECONDS:-60}
      # Agent guardrails: ceiling on agent-raised limits, agent limits expire, blocks are remembered.
      POLICY_GATE_AGENT_MAX_CAPACITY: ${POLICY_GATE_AGENT_MAX_CAPACITY:-500}
      POLICY_GATE_AGENT_OVERRIDE_TTL_SECONDS: ${POLICY_GATE_AGENT_OVERRIDE_TTL_SECONDS:-1800}
      POLICY_GATE_BLOCK_MEMORY_SECONDS: ${POLICY_GATE_BLOCK_MEMORY_SECONDS:-1800}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      AGENT_USERNAME: ${AGENT_USERNAME:-agent}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-agent}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      httpbin:
        condition: service_started
  ai-agent:
    build: ./ai-agent
    environment:
      AGENT_GATEWAY_BASE_URL: http://rate-limiter:8080
      AGENT_GATEWAY_USERNAME: ${AGENT_USERNAME:-agent}
      AGENT_GATEWAY_PASSWORD: ${AGENT_PASSWORD:-agent}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-auto}
      AGENT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_ANTHROPIC_MODEL: ${AGENT_ANTHROPIC_MODEL:-claude-opus-5-5}
      # Google Gemini: put GEMINI_API_KEY in the (gitignored) .env file next to this compose file.
      AGENT_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_GEMINI_MODEL: ${AGENT_GEMINI_MODEL:-gemini-3.5-flash}
      AGENT_OUTCOME_WAIT_SECONDS: ${AGENT_OUTCOME_WAIT_SECONDS:-10}
      AGENT_EVALUATION_WINDOW_MINUTES: ${AGENT_EVALUATION_WINDOW_MINUTES:-5}
      # Autopilot: the agent polls the detector's anomalies and investigates them on its own.
      AGENT_AUTO_INVESTIGATE: ${AGENT_AUTO_INVESTIGATE:-true}
      AGENT_AUTO_POLL_INTERVAL_SECONDS: ${AGENT_AUTO_POLL_INTERVAL_SECONDS:-15}
      AGENT_AUTO_COOLDOWN_SECONDS: ${AGENT_AUTO_COOLDOWN_SECONDS:-120}
    ports:
      - "8000:8000"
    depends_on:
      - rate-limiter
  dashboard:
    build:
      context: .
      dockerfile: dashboard-bff/Dockerfile
    environment:
      BFF_GATEWAY_BASE_URL: http://rate-limiter:8080
      BFF_AGENT_BASE_URL: http://ai-agent:8000
      BFF_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      BFF_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      BFF_DEFAULT_CAPACITY: ${RATE_LIMIT_DEFAULT_CAPACITY:-100}
    ports:
      - "8090:8090"
    depends_on:
      - rate-limiter
      - ai-agent
