services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  rate-limiter:
    build: ./rate-limiter
    environment:
      SPRING_DATA_REDIS_HOST: redis
      DOWNSTREAM_URL: ${DOWNSTREAM_URL:-http://httpbin.org}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT_CAPACITY: ${RATE_LIMIT_DEFAULT_CAPACITY:-100}
      RATE_LIMIT_DEFAULT_REFILL_RATE: ${RATE_LIMIT_DEFAULT_REFILL_RATE:-10}
      RATE_LIMIT_IDENTIFIER_TYPE: ${RATE_LIMIT_IDENTIFIER_TYPE:-IP}
      RATE_LIMIT_REDIS_FAILURE_MODE: ${RATE_LIMIT_REDIS_FAILURE_MODE:-FAIL_OPEN}
      TRAFFIC_METRICS_ENABLED: ${TRAFFIC_METRICS_ENABLED:-true}
      ANOMALY_ENABLED: ${ANOMALY_ENABLED:-true}
      ANOMALY_INTERVAL_SECONDS: ${ANOMALY_INTERVAL_SECONDS:-60}
      ANOMALY_EVALUATION_WINDOW_MINUTES: ${ANOMALY_EVALUATION_WINDOW_MINUTES:-5}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      POLICY_GATE_MAX_CHANGE_RATIO: ${POLICY_GATE_MAX_CHANGE_RATIO:-0.5}
      POLICY_GATE_MAX_BLOCK_SECONDS: ${POLICY_GATE_MAX_BLOCK_SECONDS:-3600}
      POLICY_GATE_COOLDOWN_SECONDS: ${POLICY_GATE_COOLDOWN_SECONDS:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      AGENT_USERNAME: ${AGENT_USERNAME:-agent}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-agent}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
  ai-agent:
    build: ./ai-agent
    environment:
      AGENT_GATEWAY_BASE_URL: http://rate-limiter:8080
      AGENT_GATEWAY_USERNAME: ${AGENT_USERNAME:-agent}
      AGENT_GATEWAY_PASSWORD: ${AGENT_PASSWORD:-agent}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-auto}
      AGENT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_ANTHROPIC_MODEL: ${AGENT_ANTHROPIC_MODEL:-claude-opus-5-5}
      AGENT_OUTCOME_WAIT_SECONDS: ${AGENT_OUTCOME_WAIT_SECONDS:-10}
      AGENT_EVALUATION_WINDOW_MINUTES: ${AGENT_EVALUATION_WINDOW_MINUTES:-5}
    ports:
      - "8000:8000"
    depends_on:
      - rate-limiter
